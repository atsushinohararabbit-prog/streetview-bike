<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>StreetView Bike Simulator</title>
    <style>
        body, html { margin: 0; padding: 0; height: 100%; overflow: hidden; }
        #controls {
            position: absolute; top: 10px; left: 10px; z-index: 100;
            background: rgba(255, 255, 255, 0.9); padding: 15px; border-radius: 8px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.3);
        }
        iframe { width: 100vw; height: 100vh; border: none; }
    </style>
</head>
<body>

    <div id="controls">
        <button id="connectBtn">センサーを接続する</button>
        <p>状態: <span id="status">未接続</span></p>
        <p>回転数: <span id="crankCount">0</span></p>
    </div>

    <!-- ここにあなたの指定したiframeを配置 -->
    <iframe src="https://www.google.com/maps/embed?pb=!4v1786080602405!6m8!1m7!1s_O_Lj6haIIXYt_S1EdvKZw!2m2!1d35.68369050178439!2d139.7822531568266!3f140.41782!4f0!5f0.7820865974627469" width="600" height="450" style="border:0;" allowfullscreen="" loading="lazy" referrerpolicy="strict-origin-when-cross-origin"></iframe>
    <script>
        const connectBtn = document.getElementById('connectBtn');
        const statusSpan = document.getElementById('status');
        const crankCountSpan = document.getElementById('crankCount');

        connectBtn.addEventListener('click', async () => {
            try {
                const device = await navigator.bluetooth.requestDevice({
                    filters: [{ services: ['cycling_speed_and_cadence'] }]
                });
                const server = await device.gatt.connect();
                const service = await server.getPrimaryService('cycling_speed_and_cadence');
                const characteristic = await service.getCharacteristic('cycling_speed_and_cadence_measurement');

                await characteristic.startNotifications();
                statusSpan.textContent = '接続中...';
                
                let lastCount = -1;
                characteristic.addEventListener('characteristicvaluechanged', (event) => {
                    const value = event.target.value;
                    const flags = value.getUint8(0);
                    if ((flags & 0x02) !== 0) { // クランクデータがある場合
                        let offset = (flags & 0x01) !== 0 ? 8 : 1;
                        const count = value.getUint16(offset, true);
                        crankCountSpan.textContent = count;

                        if (lastCount !== -1 && count !== lastCount) {
                            pressUpArrow();
                        }
                        lastCount = count;
                    }
                });
                statusSpan.textContent = '走行準備OK';
            } catch (err) { statusSpan.textContent = 'エラー: ' + err; }
        });

        function pressUpArrow() {
            const event = new KeyboardEvent('keydown', { key: 'ArrowUp', bubbles: true });
            document.dispatchEvent(event);
        }
    </script>
</body>
</html>
