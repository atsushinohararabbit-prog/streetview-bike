<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>Bike Simulator V1.4.0</title>
    <style>
        body, html { margin: 0; padding: 0; height: 100%; overflow: hidden; }
        #map { width: 100vw; height: 100vh; }
        #controls {
            position: absolute; top: 10px; left: 10px; z-index: 100;
            background: rgba(255, 255, 255, 0.9); padding: 15px; border-radius: 8px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.3);
        }
        #miniMap {
            position: absolute; bottom: 20px; left: 20px; width: 200px; height: 200px;
            z-index: 100; border: 2px solid white; box-shadow: 0 0 10px rgba(0,0,0,0.5);
        }
        .input-group { margin-top: 10px; }
    </style>
    <script async defer src="https://maps.googleapis.com/maps/api/js?key=AIzaSyA_OhOog3XKVQhOlTJEqmS8VXMNbr859j0
&callback=initMap"></script>
</head>
<body>
    <div id="controls">
        <button id="connectBtn">センサーを接続</button>
        <button id="getPanoBtn">現在地IDを取得</button>
        <div class="input-group">
            <input type="text" id="panoInput" placeholder="パノラマIDを入力">
            <button id="applyPanoBtn">場所を適用</button>
        </div>
        <p>Ver: 1.4.0</p>
        <p>状態: <span id="status">未接続</span></p>
    </div>
    
    <div id="map"></div>
    <div id="miniMap"></div>

    <script>
        let panorama, miniMap, marker;
        let lastPanoId = localStorage.getItem('bike_last_pano') || '_O_Lj6haIIXYt_S1EdvKZw';

        function initMap() {
            panorama = new google.maps.StreetViewPanorama(document.getElementById('map'), {
                pano: lastPanoId, pov: { heading: 0, pitch: 0 },
                motionTracking: false, motionTrackingControl: false, linksControl: false, zoomControl: false
            });

            miniMap = new google.maps.Map(document.getElementById('miniMap'), {
                zoom: 16, center: {lat: 35.6812, lng: 139.7671}, disableDefaultUI: true
            });
            marker = new google.maps.Marker({ map: miniMap, icon: 'https://maps.google.com/mapfiles/ms/micons/bike.png' });

            panorama.addListener('pano_changed', () => {
                const pos = panorama.getPosition();
                if(pos) {
                    const id = panorama.getPano();
                    localStorage.setItem('bike_last_pano', id);
                    miniMap.setCenter(pos);
                    marker.setPosition(pos);
                }
            });
        }

        document.getElementById('getPanoBtn').addEventListener('click', () => {
            prompt("現在のパノラマIDをコピーしてください:", panorama.getPano());
        });

        document.getElementById('applyPanoBtn').addEventListener('click', () => {
            const newId = document.getElementById('panoInput').value;
            if(newId) {
                localStorage.setItem('bike_last_pano', newId);
                location.reload();
            }
        });
    </script>
</body>
</html>
